<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Poll Overlay</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: transparent;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            overflow: hidden;
            padding: 20px;
        }

        #pollContainer {
            width: 380px;
            background: rgba(18, 20, 32, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            opacity: 0;
            transform: translateY(-30px) scale(0.92);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: none;
        }

        #pollContainer.active {
            display: block;
            opacity: 1;
            animation: pollSlideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pollSlideIn {
            0% {
                opacity: 0;
                transform: translateY(-40px) scale(0.88);
                filter: blur(8px);
            }
            70% {
                opacity: 1;
                transform: translateY(4px) scale(1.02);
                filter: blur(0);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .poll-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .poll-badge {
            background: linear-gradient(135deg, #9146FF, #53fc18);
            color: #000;
            font-weight: 800;
            font-size: 0.72em;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .poll-timer {
            font-size: 0.85em;
            color: #94a3b8;
            font-weight: 700;
        }

        .poll-title {
            font-size: 1.15em;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 16px;
            line-height: 1.35;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-card {
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 14px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .option-card.winner {
            border-color: #53fc18;
            box-shadow: 0 0 20px rgba(83, 252, 24, 0.3);
        }

        .bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 0%;
            background: linear-gradient(90deg, rgba(145, 70, 255, 0.35), rgba(83, 252, 24, 0.35));
            border-radius: 9px;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
        }

        .option-card.winner .bar-fill {
            background: linear-gradient(90deg, rgba(83, 252, 24, 0.45), rgba(83, 252, 24, 0.75));
        }

        .option-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-keyword {
            background: rgba(255, 255, 255, 0.12);
            color: #53fc18;
            font-size: 0.78em;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 5px;
            letter-spacing: 0.5px;
        }

        .option-label {
            font-weight: 600;
            font-size: 0.92em;
            color: #f1f5f9;
        }

        .option-stats {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 0.88em;
        }

        .option-percentage {
            color: #53fc18;
        }

        .option-votes {
            color: #64748b;
            font-size: 0.8em;
        }

        .poll-footer {
            margin-top: 14px;
            text-align: center;
            font-size: 0.78em;
            color: #64748b;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="pollContainer">
        <div class="poll-header">
            <span class="poll-badge" id="pollBadge">LIVE POLL</span>
            <span class="poll-timer" id="pollTimer">00:00</span>
        </div>
        <div class="poll-title" id="pollTitle">Loading...</div>
        <div class="options-list" id="optionsList"></div>
        <div class="poll-footer" id="pollFooter">Type option keyword in chat to vote!</div>
    </div>

    <script>
        const socket = io();
        let timerInterval = null;

        function updatePollUI(poll) {
            const container = document.getElementById('pollContainer');

            if (!poll || !poll.active) {
                container.classList.remove('active');
                if (timerInterval) clearInterval(timerInterval);
                return;
            }

            container.classList.add('active');
            document.getElementById('pollTitle').innerText = poll.title;

            if (poll.ended) {
                document.getElementById('pollBadge').innerText = 'ENDED';
                document.getElementById('pollBadge').style.background = '#ff5555';
                document.getElementById('pollTimer').innerText = 'FINAL';
                document.getElementById('pollFooter').innerText = `Total Votes: ${poll.totalVotes}`;
                if (timerInterval) clearInterval(timerInterval);
            } else {
                document.getElementById('pollBadge').innerText = 'LIVE POLL';
                document.getElementById('pollBadge').style.background = 'linear-gradient(135deg, #9146FF, #53fc18)';
                document.getElementById('pollFooter').innerText = `Type keyword in chat to vote! (${poll.totalVotes} votes)`;
                startTimer(poll.endTime);
            }

            const list = document.getElementById('optionsList');
            list.innerHTML = '';

            let maxVotes = -1;
            if (poll.ended) {
                poll.options.forEach(opt => {
                    if (opt.votes > maxVotes && opt.votes > 0) maxVotes = opt.votes;
                });
            }

            poll.options.forEach(opt => {
                const percent = poll.totalVotes > 0 ? Math.round((opt.votes / poll.totalVotes) * 100) : 0;
                const isWinner = poll.ended && opt.votes === maxVotes && maxVotes > 0;

                const card = document.createElement('div');
                card.className = `option-card ${isWinner ? 'winner' : ''}`;

                card.innerHTML = `
                    <div class="bar-fill" style="width: ${percent}%"></div>
                    <div class="option-content">
                        <div class="option-info">
                            <span class="option-keyword">${opt.keyword}</span>
                            <span class="option-label">${opt.label}</span>
                        </div>
                        <div class="option-stats">
                            <span class="option-percentage">${percent}%</span>
                            <span class="option-votes">(${opt.votes})</span>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function startTimer(endTime) {
            if (timerInterval) clearInterval(timerInterval);
            if (!endTime) {
                document.getElementById('pollTimer').innerText = 'NO LIMIT';
                return;
            }

            const updateTimer = () => {
                const now = Date.now();
                const remainingSec = Math.max(0, Math.ceil((endTime - now) / 1000));
                
                const mins = Math.floor(remainingSec / 60).toString().padStart(2, '0');
                const secs = (remainingSec % 60).toString().padStart(2, '0');
                document.getElementById('pollTimer').innerText = `${mins}:${secs}`;

                if (remainingSec <= 0) {
                    clearInterval(timerInterval);
                }
            };

            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        }

        socket.on('connect', () => {
            socket.emit('getPollState');
        });

        socket.on('pollState', (poll) => updatePollUI(poll));
        socket.on('pollUpdate', (poll) => updatePollUI(poll));
        socket.on('pollEnd', (poll) => updatePollUI(poll));
    </script>
</body>
</html>
