<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Poll Overlay</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Luckiest+Guy&family=Outfit:wght@400;600;700;800&family=Pixelify+Sans:wght@400;600;700&family=Poppins:wght@400;600;700&family=Press+Start+2P&family=Roboto:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --poll-font: 'Press Start 2P', 'Pixelify Sans', monospace, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: transparent;
            font-family: var(--poll-font);
            color: #ffffff;
            overflow: hidden;
            padding: 20px;
        }

        #pollContainer {
            width: 420px;
            background: transparent;
            border: none;
            padding: 10px;
            opacity: 0;
            transform: translateY(-30px) scale(0.92);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: none;
        }

        #pollContainer.active {
            display: block;
            opacity: 1;
            animation: pollSlideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #pollContainer.hiding {
            animation: pollSlideOut 0.4s ease-in forwards;
        }

        @keyframes pollSlideIn {
            0% {
                opacity: 0;
                transform: translateY(-30px) scale(0.9);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes pollSlideOut {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-30px) scale(0.9);
            }
        }

        /* RETRO ARCADE HEADER STYLES */
        .poll-header-block {
            text-align: center;
            margin-bottom: 18px;
        }

        .poll-title {
            font-family: var(--poll-font);
            font-size: 1.5rem;
            line-height: 1.3;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 
                -2px -2px 0px #000000,
                 2px -2px 0px #000000,
                -2px  2px 0px #000000,
                 2px  2px 0px #000000,
                 3px  3px 0px #000000,
                 0px  4px 8px rgba(0, 0, 0, 0.95);
            margin-bottom: 10px;
            word-break: break-word;
        }

        .poll-subtitle {
            font-family: var(--poll-font);
            font-size: 0.85rem;
            line-height: 1.4;
            color: #ffffff;
            text-shadow: 
                -1.5px -1.5px 0px #000000,
                 1.5px -1.5px 0px #000000,
                -1.5px  1.5px 0px #000000,
                 1.5px  1.5px 0px #000000,
                 2px    2px   0px #000000;
            letter-spacing: 0.5px;
        }

        .poll-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 
                -1.5px -1.5px 0px #000000,
                 1.5px -1.5px 0px #000000,
                -1.5px  1.5px 0px #000000,
                 1.5px  1.5px 0px #000000,
                 2px    2px   0px #000000;
        }

        .poll-timer-badge {
            background: #000000;
            border: 2px solid #000000;
            box-shadow: 2px 2px 0px #000000;
            padding: 4px 10px;
            border-radius: 6px;
            color: #ffcc00;
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* OPTIONS STACK */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-card {
            position: relative;
            height: 48px;
            background: #1b0728;
            border: 2.5px solid #000000;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7), 2px 2px 0px #000000;
        }

        /* PROGRESS BAR FILL FOR REGULAR OPTIONS */
        .bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 0%;
            background: #5c1863;
            border-radius: 7px;
            transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
        }

        /* LEADER HIGHLIGHT (NEON GREEN HIGHLIGHT & OUTLINE) */
        .option-card.leader {
            background: #1b0728;
            border: 2.5px solid #000000;
            box-shadow: 
                0 0 0 2.5px #00e600,
                0 4px 12px rgba(0, 230, 0, 0.4),
                2px 2px 0px #000000;
        }

        .option-card.leader .bar-fill {
            background: #00e600;
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.3);
        }

        /* OPTION CONTENT LAYOUT */
        .option-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            padding: 0 16px;
            font-family: var(--poll-font);
            font-size: 0.95rem;
            color: #ffffff;
            text-shadow: 
                -2px -2px 0px #000000,
                 2px -2px 0px #000000,
                -2px  2px 0px #000000,
                 2px  2px 0px #000000,
                 2.5px 2.5px 0px #000000,
                 0px 2px 4px rgba(0, 0, 0, 0.95);
            letter-spacing: 0.5px;
        }

        .option-label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 270px;
            text-transform: none;
        }

        .option-percentage {
            font-weight: 700;
            white-space: nowrap;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <div id="pollContainer">
        <div class="poll-header-block">
            <div class="poll-title" id="pollTitle">LIVE POLL</div>
            <div class="poll-subtitle" id="pollSubtitle">To vote, type your choice in chat.</div>
            <div class="poll-status-bar" id="pollStatusBar" style="display: none;">
                <span id="pollTotalVotes">0 votes</span>
                <span class="poll-timer-badge" id="pollTimer">00:00</span>
            </div>
        </div>
        <div class="options-list" id="optionsList"></div>
    </div>

    <script>
        const socket = io();
        let timerInterval = null;
        let currentFont = 'Press Start 2P';

        function changePollFont(fontName) {
            if (!fontName) return;
            currentFont = fontName.trim();
            const cleanFont = currentFont.replace(/['"]/g, '');
            
            const fontId = 'dynamic-poll-font-link';
            let link = document.getElementById(fontId);
            if (!link) {
                link = document.createElement('link');
                link.id = fontId;
                link.rel = 'stylesheet';
                document.head.appendChild(link);
            }
            link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(cleanFont).replace(/%20/g, '+')}&display=swap`;

            document.documentElement.style.setProperty('--poll-font', `'${cleanFont}', sans-serif`);
            document.body.style.fontFamily = `'${cleanFont}', sans-serif`;

            let letterSpacing = '0.5px';
            if (cleanFont.includes('Bebas Neue')) letterSpacing = '1.5px';
            if (cleanFont.includes('Outfit') || cleanFont.includes('Poppins') || cleanFont.includes('Roboto')) letterSpacing = '0.3px';

            const elements = document.querySelectorAll('.poll-title, .poll-subtitle, .option-content, .option-label, .option-percentage, .poll-timer-badge');
            elements.forEach(el => {
                el.style.fontFamily = `'${cleanFont}', sans-serif`;
                el.style.letterSpacing = letterSpacing;
            });
        }

        function updatePollUI(poll) {
            if (!poll) return;

            // Always update font even if poll is inactive
            if (poll.font) {
                changePollFont(poll.font);
            }

            const container = document.getElementById('pollContainer');

            if (!poll.active) {
                if (container.classList.contains('active')) {
                    container.classList.remove('active');
                    container.classList.add('hiding');
                    setTimeout(() => {
                        container.classList.remove('hiding');
                        container.style.display = 'none';
                    }, 400);
                } else {
                    container.style.display = 'none';
                }
                if (timerInterval) clearInterval(timerInterval);
                return;
            }

            container.classList.remove('hiding');
            container.style.display = 'block';
            container.classList.add('active');

            document.getElementById('pollTitle').innerText = poll.title || 'LIVE POLL';
            
            if (poll.ended) {
                document.getElementById('pollSubtitle').innerText = `POLL ENDED • ${poll.totalVotes || 0} TOTAL VOTES`;
                document.getElementById('pollStatusBar').style.display = 'none';
                if (timerInterval) clearInterval(timerInterval);
            } else {
                document.getElementById('pollSubtitle').innerText = 'To vote, type your choice in chat.';
                if (poll.endTime) {
                    document.getElementById('pollStatusBar').style.display = 'flex';
                    document.getElementById('pollTotalVotes').innerText = `${poll.totalVotes || 0} votes`;
                    startTimer(poll.endTime);
                } else {
                    document.getElementById('pollStatusBar').style.display = 'none';
                }
            }

            const list = document.getElementById('optionsList');

            // Find highest vote count
            let maxVotes = 0;
            (poll.options || []).forEach(opt => {
                if (opt.votes > maxVotes) maxVotes = opt.votes;
            });

            // Copy and sort options descending by votes
            const sortedOptions = [...(poll.options || [])].sort((a, b) => {
                if (b.votes !== a.votes) return b.votes - a.votes;
                return a.id - b.id;
            });

            list.innerHTML = '';

            sortedOptions.forEach(opt => {
                const percent = poll.totalVotes > 0 ? Math.round((opt.votes / poll.totalVotes) * 100) : 0;
                const isLeader = (opt.votes === maxVotes && maxVotes > 0) || (sortedOptions.length > 0 && sortedOptions[0].id === opt.id && maxVotes > 0);

                const card = document.createElement('div');
                card.className = `option-card ${isLeader ? 'leader' : ''}`;
                card.setAttribute('data-id', opt.id);

                card.innerHTML = `
                    <div class="bar-fill" style="width: ${percent}%"></div>
                    <div class="option-content" style="font-family: '${currentFont}', sans-serif;">
                        <span class="option-label">${escapeHtml(opt.label || opt.keyword)}</span>
                        <span class="option-percentage">${percent}%</span>
                    </div>
                `;
                list.appendChild(card);
            });

            // Re-apply current font styling to updated elements
            changePollFont(currentFont);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function startTimer(endTime) {
            if (timerInterval) clearInterval(timerInterval);
            if (!endTime) return;

            const updateTimer = () => {
                const now = Date.now();
                const remainingSec = Math.max(0, Math.ceil((endTime - now) / 1000));
                
                const mins = Math.floor(remainingSec / 60).toString().padStart(2, '0');
                const secs = (remainingSec % 60).toString().padStart(2, '0');
                document.getElementById('pollTimer').innerText = `${mins}:${secs}`;

                if (remainingSec <= 0) {
                    clearInterval(timerInterval);
                }
            };

            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        }

        // Initialize font from URL parameter on load (if specified), otherwise default
        const urlParams = new URLSearchParams(window.location.search);
        const urlFont = urlParams.get('font');
        if (urlFont) {
            changePollFont(urlFont);
        }

        socket.on('connect', () => {
            socket.emit('getPollState');
        });

        socket.on('pollFontChanged', (data) => {
            if (data && data.font) {
                changePollFont(data.font);
            }
        });

        socket.on('pollCreated', (poll) => updatePollUI(poll));
        socket.on('pollState', (poll) => updatePollUI(poll));
        socket.on('pollUpdate', (poll) => updatePollUI(poll));
        socket.on('pollEnd', (poll) => updatePollUI(poll));
    </script>
</body>
</html>
